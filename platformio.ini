[env:xteink_x3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DXTEINK_X3=1
  -DDISPLAY_WIDTH=528
  -DDISPLAY_HEIGHT=792
  -DBOARD_HAS_PSRAM=0
  -Os
